[project]
name = "Ragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-community>=0.2.12",
    "langchain-text-splitters>=0.2.2",
    "langchain-openai>=0.1.22",
    "langgraph>=0.2.31",
    "pypdf>=4.3.1",
    "docx2txt>=0.8",
    "unstructured",
    "openpyxl",
    "tabulate",
    "msoffcrypto-tool",
    "redis>=7.4.0",
    "psycopg2-binary>=2.9.11",
    "passlib[bcrypt]>=1.7.4",
    "sentence-transformers>=5.3.0",
    "torch>=2.11.0",
    "python-jose[cryptography]>=3.5.0",
    "pymysql>=1.1.2",
    "python-docx>=1.2.0",
    "pandas>=3.0.1",
    "tavily-python>=0.5.0",
    "neo4j>=6.2.0",
    "networkx>=3.6.1",
    "python-louvain>=0.16",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

"ragas>=0.2.0",
    "datasets>=2.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[project.optional-dependencies]
study = [
    "langchain-classic>=0.2.0",
    "chromadb>=0.5.5",
    "bilibili-api-python>=17.0.0",
]
