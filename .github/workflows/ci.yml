name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Verify package imports
        run: |
          uv run python -c "
          # Core modules (no external services required)
          from backend.schemas import DocumentDeleteResponse, HitlResumeRequest
          from backend.documents.graph_extractor import EntityInfo, RelationInfo, ExtractionResult
          from backend.storage.models import ParentChunk, DocumentIndex, CommunitySummary
          from backend.ha.circuit_breaker import CircuitBreaker, CircuitBreakerOpenError
          from backend.ha.retry import with_retry
          from backend.ha.degradation import safe_graph_search
          from backend.observability.logging import init_logging, get_logger
          from backend.evaluation.dataset import load_golden_dataset
          print('All imports verified')
          "

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short
